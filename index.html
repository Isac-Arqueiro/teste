<!DOCTYPE html>
<html>
<body>

<h2>Painel Controle</h2>

<input id="id" placeholder="box1"><br><br>

<button onclick="bloquear()">Bloquear</button>
<button onclick="liberar()">Liberar</button><br><br>

<input id="tempo" placeholder="Tempo em segundos">
<button onclick="tempo()">Tempo diário</button><br><br>

<input id="msg" placeholder="Mensagem">
<button onclick="msg()">Enviar Aviso</button>

<script>
function enviar(dados){
  fetch("https://api.jsonbin.io/v3/b/YOUR_ID", {
    method:"PUT",
    headers:{
      "Content-Type":"application/json",
      "X-Master-Key":"SUA_CHAVE"
    },
    body: JSON.stringify(dados)
  });
}

function bloquear(){
  enviar({ box1:{cmd:"bloquear"} });
}

function liberar(){
  enviar({ box1:{cmd:"liberar"} });
}

function tempo(){
  let t = document.getElementById("tempo").value;
  enviar({ box1:{cmd:"tempo", tempo:parseInt(t)} });
}

function msg(){
  let m = document.getElementById("msg").value;
  enviar({ box1:{cmd:"msg", msg:m} });
}
</script>

</body>
</html>
