
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090912">
<title>Arqueiro Player</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#090912;
  color:#fff;
  font-family:Arial,sans-serif;
  min-height:100vh;
}
header{
  padding:22px;
  text-align:center;
  font-size:23px;
  font-weight:bold;
  letter-spacing:2px;
  color:#a78bfa;
}
main{
  max-width:480px;
  margin:30px auto;
  padding:20px;
}
.panel{
  background:#151522;
  border:1px solid #29293c;
  border-radius:20px;
  padding:24px;
  margin-bottom:20px;
}
h2{font-size:20px;margin-bottom:18px}
label{
  display:block;
  margin:14px 0 7px;
  color:#c4b5fd;
  font-size:13px;
}
input{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #39394c;
  background:#0d0d18;
  color:white;
  outline:none;
}
button{
  width:100%;
  border:0;
  padding:14px;
  margin-top:15px;
  border-radius:12px;
  background:#7c3aed;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#6d28d9}
.secondary{background:#242438}
.cover{
  width:210px;
  height:210px;
  margin:10px auto 25px;
  border-radius:22px;
  background:linear-gradient(135deg,#7c3aed,#17152c,#2563eb);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}
.center{text-align:center}
.muted{color:#9999ad;font-size:14px}
audio{width:100%;margin-top:25px}
.hidden{display:none}
#musicPage{padding-top:35px}
#musicPage .panel{padding:28px 22px}
#shareButton{background:#168d50}
</style>
</head>
<body>

<header>🏹 ARQUEIRO PLAYER</header>

<main>

<!-- ÁREA ADMINISTRATIVA -->
<section id="adminPage" class="panel">
<h2>Adicionar música</h2>

<label>Nome da música</label>
<input id="title" placeholder="Nome da música">

<label>Autor / Artista</label>
<input id="artist" placeholder="Nome do autor">

<label>Link direto do áudio (opcional)</label>
<input id="audioUrl" placeholder="https://site.com/musica.mp3">

<label>Ou enviar arquivo de áudio</label>
<input id="audioFile" type="file" accept="audio/*">

<button onclick="createMusic()">Cadastrar música</button>
<p id="message" class="muted center" style="margin-top:15px"></p>
</section>

<!-- PÁGINA PÚBLICA DE REPRODUÇÃO -->
<section id="musicPage" class="hidden">
<div class="panel center">
<div class="cover">🎵</div>
<h2 id="musicTitle">Nome da música</h2>
<p id="musicArtist" class="muted">Artista</p>

<audio id="player" controls preload="metadata">
Seu navegador não suporta áudio.
</audio>

<button id="shareButton" onclick="shareWhatsApp()">
Compartilhar pelo WhatsApp
</button>

<button class="secondary" onclick="copyLink()">
Copiar link da música
</button>

<p class="muted" style="margin-top:25px">
Ouça no Arqueiro Player
</p>
</div>
</section>

</main>

<script>
const adminPage=document.getElementById('adminPage');
const musicPage=document.getElementById('musicPage');
const player=document.getElementById('player');

function showMusic(data){
  adminPage.classList.add('hidden');
  musicPage.classList.remove('hidden');

  document.getElementById('musicTitle').textContent=data.title;
  document.getElementById('musicArtist').textContent=data.artist;

  player.src=data.audio;
  document.title=data.title+' - Arqueiro Player';

  // Metadados para prévia de compartilhamento
  let meta=document.createElement('meta');
  meta.setAttribute('property','og:title');
  meta.content=data.title+' - Arqueiro Player';
  document.head.appendChild(meta);

  let description=document.createElement('meta');
  description.setAttribute('property','og:description');
  description.content='Ouça '+data.title+' de '+data.artist+' no Arqueiro Player.';
  document.head.appendChild(description);
}

function createMusic(){
  const title=document.getElementById('title').value.trim();
  const artist=document.getElementById('artist').value.trim();
  const url=document.getElementById('audioUrl').value.trim();
  const file=document.getElementById('audioFile').files[0];

  if(!title||!artist||(!url&&!file)){
    document.getElementById('message').textContent=
      'Preencha os campos e adicione um áudio.';
    return;
  }

  if(url){
    try{
      const parsed=new URL(url);
      if(!['http:','https:'].includes(parsed.protocol))
        throw new Error();
    }catch{
      document.getElementById('message').textContent=
        'Informe um link HTTP ou HTTPS válido.';
      return;
    }
  }

  const audio=file?URL.createObjectURL(file):url;

  showMusic({title,artist,audio});

  document.getElementById('message').textContent=
    'Música carregada para reprodução!';
}

function shareWhatsApp(){
  const text=
    'Ouça '+document.getElementById('musicTitle').textContent+
    ' - '+document.getElementById('musicArtist').textContent+
    '\n'+window.location.href;

  window.open(
    'https://wa.me/?text='+encodeURIComponent(text),
    '_blank'
  );
}

function copyLink(){
  navigator.clipboard.writeText(window.location.href)
    .then(()=>alert('Link copiado!'))
    .catch(()=>alert('Não foi possível copiar o link.'));
}

// Abre diretamente a música quando houver dados na URL.
// A integração com o banco de dados será implementada depois.
</script>
</body>
</html>
