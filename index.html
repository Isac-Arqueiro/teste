<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicializador</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #243b55, #0b0f14 60%);

            color: white;
        }

        .container {
            width: 90%;
            max-width: 480px;

            padding: 40px;

            text-align: center;

            background: rgba(22, 27, 34, .96);

            border: 1px solid #30363d;
            border-radius: 20px;

            box-shadow: 0 25px 70px rgba(0,0,0,.55);
        }

        .logo {
            width: 80px;
            height: 80px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #238636;

            font-size: 38px;
        }

        h1 {
            margin: 0 0 10px;
        }

        p {
            color: #8b949e;
            line-height: 1.6;
        }

        #arquivo {
            display: none;
        }

        button {
            width: 100%;

            padding: 16px;
            margin-top: 15px;

            border: 0;
            border-radius: 10px;

            background: #238636;

            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        #status {
            min-height: 24px;
            margin-top: 20px;

            color: #58a6ff;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">▶</div>

    <h1>Meu Site</h1>

    <p>
        Selecione o arquivo HTML do seu site.
    </p>

    <input
        id="arquivo"
        type="file"
        accept=".html,.htm"
    >

    <button id="botao">
        ABRIR MEU SITE
    </button>

    <div id="status"></div>

</div>

<script>
"use strict";

const botao = document.getElementById("botao");
const arquivo = document.getElementById("arquivo");
const status = document.getElementById("status");


botao.addEventListener("click", function () {

    status.textContent = "";

    arquivo.value = "";

    /*
     * O seletor de arquivos é aberto diretamente
     * pela ação do usuário.
     */

    arquivo.click();

});


arquivo.addEventListener("change", function () {

    if (!arquivo.files.length) {
        return;
    }

    const file = arquivo.files[0];

    if (!/\.(html?|HTML?)$/.test(file.name)) {

        status.textContent =
            "Selecione um arquivo HTML válido.";

        return;
    }

    status.textContent =
        "Carregando " + file.name + "...";

    /*
     * Lê o HTML escolhido.
     */

    const leitor = new FileReader();

    leitor.onload = function () {

        const html = leitor.result;

        /*
         * Substitui o conteúdo do inicializador
         * pelo conteúdo do seu site.
         */

        document.open();

        document.write(html);

        document.close();

    };

    leitor.onerror = function () {

        status.textContent =
            "Não foi possível ler o arquivo.";

    };

    leitor.readAsText(file);

});
</script>

</body>
</html>
