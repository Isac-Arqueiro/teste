/* GRID RESPONSIVO */
.container {

}

/* CATEGORIAS */

  padding-bottom: 15px;
}

.categorias a {

  margin: 8px auto;

  border-radius: 10px;

  color: black;
  border: 1px solid #ccc;
  font-size: 16px;

  /* efeito 3D */
  box-shadow: 4px 4px 8px rgba(0,0,0,0.2),
              -2px -2px 6px rgba(255,255,255,0.7);

  transition: all 0.2s ease;
}

.categorias a:active {
  box-shadow: inset 3px 3px 6px rgba(0,0,0,0.2),
              inset -2px -2px 5px rgba(255,255,255,0.7);
  transform: scale(0.97);
}

.categorias a:active {
  background: #eee;
}

/* BOTÃO INSTALL */

  font-size: 16px;

<button id="btnInstall">📲 Instalar App</button>

<script>
function toggleCategorias(id) {
  let div = document.getElementById(id);

  document.querySelectorAll(".categorias").forEach(el => {
    if (el.id !== id) el.style.display = "none";
  });

  div.style.display = div.style.display === "block" ? "none" : "block";
}

// PWA
let deferredPrompt;
const btnInstall = document.getElementById("btnInstall");

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  btnInstall.style.display = "block";
});

btnInstall.addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    btnInstall.style.display = "none";
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>
<!-- Botão discreto -->
<button id="shareBtn" title="Compartilhar"></button>

<style>
  #shareBtn {
    position: fixed;
    bottom: 15px;
    right: 15px;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: #25D366; /* verde */
    color: white;
    cursor: pointer;
    opacity: 0.6;
    transition: 0.3s;
    font-size: 18px;
  }

  #shareBtn:hover {
    opacity: 1;
    transform: scale(1.1);
  }

  #shareBtn::before {
    content: "⤴";
  }
</style>

<script>
  const btn = document.getElementById("shareBtn");

  btn.addEventListener("click", async () => {
    const url = "https://meusaplicativoscom-pixel.github.io/buscarpromo-o/";
    const title = "Confira esse site!";

    if (navigator.share) {
      try {
        await navigator.share({
          title: title,
          url: url
        });
      } catch (err) {
        console.log("Erro ao compartilhar:", err);
      }
    } else {
      try {
        await navigator.clipboard.writeText(url);
        alert("Link copiado!");
      } catch {
        prompt("Copie o link:", url);
      }
    }
  });
</script>
