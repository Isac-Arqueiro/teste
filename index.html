<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Meu Player</title>


<style>

/* =====================================================
   CORES
===================================================== */

:root {

    --fundo: #070b12;

    --fundo-menu: #0b1119;

    --card: #131b25;

    --azul: #00a8e1;

    --azul-claro: #19bff2;

    --branco: #ffffff;

    --cinza: #aab3be;

    --cinza-escuro: #687482;

}


/* =====================================================
   RESET
===================================================== */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


html {

    scroll-behavior: smooth;

}


body {

    background:

        radial-gradient(
            circle at 50% -20%,
            rgba(0,168,225,.12),
            transparent 38%
        ),

        var(--fundo);

    color: var(--branco);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;

    overflow-x: hidden;

}


/* =====================================================
   TOPO
===================================================== */

.topo {

    position: sticky;

    top: 0;

    z-index: 1000;

    height: 70px;

    display: flex;

    align-items: center;

    padding: 0 4%;

    background:

        rgba(7,11,18,.96);

    backdrop-filter:
        blur(15px);

    border-bottom:
        1px solid
        rgba(255,255,255,.06);

}


.logo {

    font-size: 25px;

    font-weight: 800;

    letter-spacing: -1px;

    white-space: nowrap;

}


.logo span {

    color: var(--azul);

}


/* =====================================================
   PESQUISA
===================================================== */

.pesquisa {

    margin-left: auto;

}


.pesquisa input {

    width: 240px;

    height: 40px;

    padding: 0 15px;

    border-radius: 6px;

    border:
        1px solid
        rgba(255,255,255,.10);

    outline: none;

    background:
        rgba(255,255,255,.06);

    color: white;

    font-size: 14px;

    transition: .25s;

}


.pesquisa input:focus {

    width: 290px;

    border-color:
        var(--azul);

    background:
        rgba(255,255,255,.09);

}


.pesquisa input::placeholder {

    color: #778391;

}


/* =====================================================
   CATEGORIAS
===================================================== */

.menu-categorias {

    position: sticky;

    top: 70px;

    z-index: 900;

    display: flex;

    gap: 9px;

    padding: 13px 4%;

    overflow-x: auto;

    background:
        rgba(7,11,18,.96);

    backdrop-filter:
        blur(15px);

    border-bottom:
        1px solid
        rgba(255,255,255,.05);

    scrollbar-width: none;

}


.menu-categorias::-webkit-scrollbar {

    display: none;

}


.botao-categoria {

    flex-shrink: 0;

    padding: 9px 18px;

    border-radius: 5px;

    border:
        1px solid
        rgba(255,255,255,.10);

    background:
        rgba(255,255,255,.045);

    color:
        #aeb7c3;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition: .2s;

}


.botao-categoria:hover {

    color: white;

    background:
        rgba(255,255,255,.10);

}


.botao-categoria.ativo {

    color: white;

    background:
        var(--azul);

    border-color:
        var(--azul);

    box-shadow:
        0 5px 20px
        rgba(0,168,225,.25);

}


/* =====================================================
   CONTEÚDO
===================================================== */

.conteudo {

    width: 92%;

    max-width: 1700px;

    margin: auto;

    padding:
        30px 0 80px;

}


/* =====================================================
   TÍTULOS
===================================================== */

.titulo-secao {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;

}


.titulo-secao h2 {

    font-size: 21px;

}


.titulo-secao span {

    color:
        var(--cinza-escuro);

    font-size: 12px;

}


/* =====================================================
   DESTAQUES
===================================================== */

.destaques {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 18px;

    margin-bottom: 45px;

}


.destaque {

    position: relative;

    height: 300px;

    overflow: hidden;

    border-radius: 10px;

    background: #111;

    cursor: pointer;

    box-shadow:
        0 12px 35px
        rgba(0,0,0,.35);

    transition:
        transform .3s,
        box-shadow .3s;

}


.destaque:hover {

    transform:
        translateY(-5px);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.65);

}


.destaque img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    transition:
        transform .5s;

}


.destaque:hover img {

    transform:
        scale(1.07);

}


.destaque::after {

    content: "";

    position: absolute;

    inset: 0;

    background:

        linear-gradient(
            to top,
            rgba(0,0,0,.95),
            rgba(0,0,0,.35) 50%,
            transparent
        );

}


.destaque-info {

    position: absolute;

    z-index: 2;

    left: 20px;

    right: 20px;

    bottom: 18px;

}


.destaque-titulo {

    font-size: 20px;

    font-weight: 700;

    margin-bottom: 6px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.destaque-categoria {

    color:
        #c6ced8;

    font-size: 12px;

}


.destaque-play {

    position: absolute;

    z-index: 3;

    right: 18px;

    bottom: 18px;

    width: 46px;

    height: 46px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        var(--azul);

    font-size: 18px;

}


/* =====================================================
   SEÇÃO DE VÍDEOS
===================================================== */

.secao {

    margin-bottom: 42px;

}


.carrossel {

    position: relative;

}


/* =====================================================
   LINHA DE FILMES
===================================================== */

.linha-filmes {

    display: flex;

    gap: 15px;

    overflow-x: auto;

    scroll-behavior: smooth;

    padding:
        5px 5px 15px;

    scrollbar-width: thin;

    scrollbar-color:
        #293542
        transparent;

}


.linha-filmes::-webkit-scrollbar {

    height: 6px;

}


.linha-filmes::-webkit-scrollbar-thumb {

    background:
        #293542;

    border-radius: 20px;

}


/* =====================================================
   CARD
===================================================== */

.card {

    position: relative;

    flex:
        0 0 230px;

    border-radius: 8px;

    overflow: hidden;

    background:
        var(--card);

    cursor: pointer;

    transition:
        transform .25s,
        box-shadow .25s;

}


.card:hover {

    transform:
        scale(1.045);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.7);

    z-index: 10;

}


.card-imagem {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    overflow: hidden;

    background:
        #18212c;

}


.card-imagem img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    transition:
        transform .4s;

}


.card:hover
.card-imagem img {

    transform:
        scale(1.07);

}


.card-play {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,.35);

    opacity: 0;

    transition: .25s;

}


.card:hover .card-play {

    opacity: 1;

}


.circulo-play {

    width: 44px;

    height: 44px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        var(--azul);

}


/* =====================================================
   FAVORITO
===================================================== */

.favorito {

    position: absolute;

    z-index: 20;

    top: 8px;

    right: 8px;

    width: 32px;

    height: 32px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(0,0,0,.75);

    color: white;

    font-size: 18px;

    cursor: pointer;

}


.favorito.ativo {

    color:
        var(--azul);

}


/* =====================================================
   INFORMAÇÕES
===================================================== */

.card-info {

    padding: 11px;

}


.card-titulo {

    font-size: 14px;

    font-weight: 700;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.card-categoria {

    margin-top: 5px;

    color:
        var(--cinza-escuro);

    font-size: 11px;

}


/* =====================================================
   SETAS
===================================================== */

.seta {

    position: absolute;

    top: 45%;

    z-index: 50;

    transform:
        translateY(-50%);

    width: 45px;

    height: 70px;

    border: 0;

    background:
        rgba(0,0,0,.80);

    color: white;

    font-size: 30px;

    cursor: pointer;

    opacity: 0;

    transition: .2s;

}


.carrossel:hover .seta {

    opacity: 1;

}


.seta:hover {

    background:
        var(--azul);

}


.seta-esquerda {

    left: 0;

}


.seta-direita {

    right: 0;

}


/* =====================================================
   SEM RESULTADO
===================================================== */

.vazio {

    text-align: center;

    padding:
        80px 20px;

    color:
        var(--cinza);

}


.vazio h2 {

    color: white;

    margin-bottom: 10px;

}


/* =====================================================
   PLAYER
===================================================== */

.player-fundo {

    position: fixed;

    inset: 0;

    z-index: 5000;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,.94);

    backdrop-filter:
        blur(10px);

    padding: 20px;

}


.player-fundo.aberto {

    display: flex;

}


.player {

    width: 96%;

    max-width: 1200px;

    background: #000;

    border-radius: 9px;

    overflow: hidden;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.95);

}


/* =====================================================
   TOPO DO PLAYER
===================================================== */

.player-topo {

    position: relative;

    height: 55px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 12px;

    background:
        #0c1118;

}


.botao-voltar {

    height: 36px;

    padding:
        0 14px;

    display: flex;

    align-items: center;

    gap: 7px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius: 5px;

    background:
        rgba(255,255,255,.07);

    color: white;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    transition: .2s;

}


.botao-voltar:hover {

    background:
        var(--azul);

    border-color:
        var(--azul);

}


.nome-player {

    position: absolute;

    left: 50%;

    transform:
        translateX(-50%);

    width: 50%;

    text-align: center;

    font-size: 14px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.botao-fechar {

    width: 36px;

    height: 36px;

    border: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-size: 23px;

    cursor: pointer;

}


.botao-fechar:hover {

    background:
        #e63946;

}


/* =====================================================
   TELA DO PLAYER
===================================================== */

.tela-player {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: black;

}


.tela-player iframe {

    width: 100%;

    height: 100%;

    border: 0;

}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width: 900px) {

    .destaques {

        display: flex;

        overflow-x: auto;

        gap: 15px;

        scrollbar-width: none;

    }


    .destaques::-webkit-scrollbar {

        display: none;

    }


    .destaque {

        flex:
            0 0 72vw;

        height: 260px;

    }

}


@media(max-width: 600px) {

    .topo {

        height: 60px;

        padding:
            0 15px;

    }


    .logo {

        font-size: 20px;

    }


    .pesquisa input {

        width: 145px;

    }


    .pesquisa input:focus {

        width: 175px;

    }


    .menu-categorias {

        top: 60px;

        padding:
            11px 15px;

    }


    .conteudo {

        width: 94%;

        padding-top:
            22px;

    }


    .destaque {

        flex-basis: 84vw;

        height: 220px;

    }


    .card {

        flex-basis: 180px;

    }


    .seta {

        display: none;

    }


    .player-fundo {

        padding: 8px;

    }


    .nome-player {

        width: 42%;

    }


    .botao-voltar span {

        display: none;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     TOPO
===================================================== -->

<header class="topo">

    <div class="logo">

        MEU<span>PLAYER</span>

    </div>


    <div class="pesquisa">

        <input
            id="pesquisa"
            type="search"
            placeholder="Pesquisar..."
            autocomplete="off"
        >

    </div>

</header>


<!-- =====================================================
     CATEGORIAS
===================================================== -->

<nav
    id="menuCategorias"
    class="menu-categorias"
>
</nav>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main
    id="conteudo"
    class="conteudo"
>

    <div class="vazio">

        Carregando vídeos...

    </div>

</main>


<!-- =====================================================
     PLAYER
===================================================== -->

<div
    id="playerFundo"
    class="player-fundo"
>

    <div class="player">


        <div class="player-topo">


            <!-- BOTÃO VOLTAR -->

            <button
                class="botao-voltar"
                onclick="fecharPlayer()"
            >

                ←

                <span>
                    Voltar
                </span>

            </button>


            <!-- NOME -->

            <div
                id="nomePlayer"
                class="nome-player"
            >
                Reproduzindo
            </div>


            <!-- FECHAR -->

            <button
                class="botao-fechar"
                onclick="fecharPlayer()"
                aria-label="Fechar"
            >

                ×

            </button>


        </div>


        <div class="tela-player">

            <iframe
                id="youtubePlayer"
                src=""
                allow="
                    autoplay;
                    encrypted-media;
                    picture-in-picture;
                    fullscreen
                "
                allowfullscreen
            ></iframe>

        </div>


    </div>

</div>


<script>

/* =====================================================
   SEU JSON
===================================================== */

const JSON_URL =
"https://raw.githubusercontent.com/Isac-Arqueiro/mylist/refs/heads/main/canaisyoutube.json";


/* =====================================================
   VARIÁVEIS
===================================================== */

let videos = [];

let categoriaAtual = "Todos";

let favoritos =
    JSON.parse(
        localStorage.getItem(
            "meusFavoritos"
        ) || "[]"
    );


/* =====================================================
   CARREGAR
===================================================== */

async function carregarVideos() {

    try {

        const resposta =
            await fetch(
                JSON_URL +
                "?v=" +
                Date.now()
            );


        if (!resposta.ok) {

            throw new Error(
                "Erro " +
                resposta.status
            );

        }


        const json =
            await resposta.json();


        /*
           IMPORTANTE:

           Seu JSON usa:

           videos

           e cada vídeo possui:

           titulo
           capa
           video
           categoria
        */

        videos =
            Array.isArray(
                json.videos
            )
            ? json.videos
            : [];


        criarMenuCategorias();

        mostrarInicio();


    } catch (erro) {

        console.error(erro);


        document
            .getElementById(
                "conteudo"
            )
            .innerHTML = `

                <div class="vazio">

                    <h2>
                        Erro ao carregar os vídeos
                    </h2>

                    <p>
                        Verifique se o JSON está
                        disponível no GitHub.
                    </p>

                </div>

            `;

    }

}


/* =====================================================
   CRIAR MENU
===================================================== */

function criarMenuCategorias() {

    const menu =
        document.getElementById(
            "menuCategorias"
        );


    menu.innerHTML = "";


    /* TODOS */

    criarBotaoCategoria(
        "Todos",
        true
    );


    /*
       ENCONTRAR CATEGORIAS
       AUTOMATICAMENTE
    */

    const categorias =
        [
            ...new Set(
                videos
                    .map(
                        video =>
                            video.categoria
                    )
                    .filter(Boolean)
            )
        ];


    categorias.forEach(
        categoria => {

            criarBotaoCategoria(
                categoria
            );

        }
    );


    /* FAVORITOS */

    criarBotaoCategoria(
        "♥ Favoritos"
    );

}


/* =====================================================
   BOTÃO DE CATEGORIA
===================================================== */

function criarBotaoCategoria(
    nome,
    ativo = false
) {

    const botao =
        document.createElement(
            "button"
        );


    botao.className =
        "botao-categoria" +
        (
            ativo
            ? " ativo"
            : ""
        );


    botao.textContent =
        nome;


    botao.onclick =
        function() {


            document
                .querySelectorAll(
                    ".botao-categoria"
                )
                .forEach(
                    item =>
                        item.classList
                            .remove("ativo")
                );


            botao.classList
                .add("ativo");


            if (
                nome ===
                "Todos"
            ) {

                categoriaAtual =
                    "Todos";

                mostrarInicio();

            }


            else if (
                nome ===
                "♥ Favoritos"
            ) {

                categoriaAtual =
                    "Favoritos";

                mostrarFavoritos();

            }


            else {

                categoriaAtual =
                    nome;

                mostrarCategoria(
                    nome
                );

            }

        };


    document
        .getElementById(
            "menuCategorias"
        )
        .appendChild(
            botao
        );

}


/* =====================================================
   PÁGINA INICIAL
===================================================== */

function mostrarInicio() {

    let html = "";


    /* =================================================
       3 DESTAQUES
    ================================================= */

    const destaques =
        videos.slice(
            0,
            3
        );


    if (
        destaques.length
    ) {

        html += `

            <div class="titulo-secao">

                <h2>
                    Destaques
                </h2>

                <span>
                    Em destaque
                </span>

            </div>


            <section
                class="destaques"
            >

                ${
                    destaques
                        .map(
                            criarDestaque
                        )
                        .join("")
                }

            </section>

        `;

    }


    /* =================================================
       TODAS AS CATEGORIAS
    ================================================= */

    const categorias =
        [
            ...new Set(
                videos
                    .map(
                        video =>
                            video.categoria
                    )
                    .filter(Boolean)
            )
        ];


    categorias.forEach(
        categoria => {

            const lista =
                videos.filter(
                    video =>
                        video.categoria ===
                        categoria
                );


            html +=
                criarSecao(
                    categoria,
                    lista
                );

        }
    );


    document
        .getElementById(
            "conteudo"
        )
        .innerHTML =
            html ||
            `

                <div class="vazio">

                    Nenhum vídeo encontrado.

                </div>

            `;


    ativarEventos();

}


/* =====================================================
   DESTAQUE
===================================================== */

function criarDestaque(
    video
) {

    return `

        <article
            class="destaque"
            data-video-id="${escapar(video.video)}"
        >

            <img
                src="${escapar(video.capa)}"
                alt="${escapar(video.titulo)}"
                loading="lazy"
            >


            <div class="destaque-info">

                <div class="destaque-titulo">

                    ${escaparHTML(
                        video.titulo
                    )}

                </div>


                <div class="destaque-categoria">

                    ${escaparHTML(
                        video.categoria
                    )}

                </div>

            </div>


            <div class="destaque-play">

                ▶

            </div>

        </article>

    `;

}


/* =====================================================
   CRIAR SEÇÃO
===================================================== */

function criarSecao(
    categoria,
    lista
) {

    return `

        <section class="secao">


            <div class="titulo-secao">

                <h2>

                    ${escaparHTML(
                        categoria
                    )}

                </h2>


                <span>

                    ${lista.length}
                    títulos

                </span>

            </div>


            <div class="carrossel">


                <button
                    class="seta seta-esquerda"
                    onclick="rolarCarrossel(this, -600)"
                >

                    ‹

                </button>


                <div
                    class="linha-filmes"
                >

                    ${
                        lista
                            .map(
                                criarCard
                            )
                            .join("")
                    }

                </div>


                <button
                    class="seta seta-direita"
                    onclick="rolarCarrossel(this, 600)"
                >

                    ›

                </button>


            </div>

        </section>

    `;

}


/* =====================================================
   CARD
===================================================== */

function criarCard(
    video
) {

    const favorito =
        favoritos.includes(
            video.video
        );


    return `

        <article
            class="card"
            data-video-id="${escapar(video.video)}"
        >


            <button
                class="
                    favorito
                    ${favorito ? "ativo" : ""}
                "
                data-favorito="${escapar(video.video)}"
                title="Favorito"
            >

                ${
                    favorito
                    ? "♥"
                    : "♡"
                }

            </button>


            <div
                class="card-imagem"
            >

                <img
                    src="${escapar(video.capa)}"
                    alt="${escapar(video.titulo)}"
                    loading="lazy"
                >


                <div
                    class="card-play"
                >

                    <div
                        class="circulo-play"
                    >

                        ▶

                    </div>

                </div>

            </div>


            <div
                class="card-info"
            >

                <div
                    class="card-titulo"
                >

                    ${escaparHTML(
                        video.titulo
                    )}

                </div>


                <div
                    class="card-categoria"
                >

                    ${escaparHTML(
                        video.categoria
                    )}

                </div>

            </div>


        </article>

    `;

}


/* =====================================================
   EVENTOS
===================================================== */

function ativarEventos() {


    /* CARDS */

    document
        .querySelectorAll(
            ".card"
        )
        .forEach(
            card => {


                card.onclick =
                    function(event) {


                        const botao =
                            event.target.closest(
                                "[data-favorito]"
                            );


                        if (
                            botao
                        ) {

                            event
                                .stopPropagation();


                            alternarFavorito(
                                botao.dataset
                                    .favorito
                            );


                            return;

                        }


                        abrirVideo(
                            card.dataset
                                .videoId
                        );

                    };

            }
        );


    /* DESTAQUES */

    document
        .querySelectorAll(
            ".destaque"
        )
        .forEach(
            destaque => {


                destaque.onclick =
                    function() {

                        abrirVideo(
                            this.dataset
                                .videoId
                        );

                    };

            }
        );

}


/* =====================================================
   ABRIR VÍDEO
===================================================== */

function abrirVideo(
    id
) {

    const video =
        videos.find(
            item =>
                item.video === id
        );


    if (!video) {

        return;

    }


    const player =
        document.getElementById(
            "youtubePlayer"
        );


    const fundo =
        document.getElementById(
            "playerFundo"
        );


    const nome =
        document.getElementById(
            "nomePlayer"
        );


    nome.textContent =
        video.titulo;


    player.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(id) +
        "?autoplay=1&rel=0";


    fundo.classList.add(
        "aberto"
    );


    document.body.style.overflow =
        "hidden";

}


/* =====================================================
   FECHAR PLAYER
===================================================== */

function fecharPlayer() {

    const player =
        document.getElementById(
            "youtubePlayer"
        );


    const fundo =
        document.getElementById(
            "playerFundo"
        );


    /*
       Isso também PARA o vídeo.
    */

    player.src = "";


    fundo.classList.remove(
        "aberto"
    );


    document.body.style.overflow =
        "";

}


/* =====================================================
   ESC NO TECLADO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Escape"
        ) {

            fecharPlayer();

        }

    }
);


/* =====================================================
   CLICAR FORA DO PLAYER
===================================================== */

document
    .getElementById(
        "playerFundo"
    )
    .addEventListener(
        "click",
        function(event) {


            if (
                event.target ===
                this
            ) {

                fecharPlayer();

            }

        }
    );


/* =====================================================
   FAVORITOS
===================================================== */

function alternarFavorito(
    id
) {


    if (
        favoritos.includes(id)
    ) {

        favoritos =
            favoritos.filter(
                item =>
                    item !== id
            );

    }

    else {

        favoritos.push(id);

    }


    localStorage.setItem(
        "meusFavoritos",
        JSON.stringify(
            favoritos
        )
    );


    if (
        categoriaAtual ===
        "Favoritos"
    ) {

        mostrarFavoritos();

    }

    else if (
        categoriaAtual ===
        "Todos"
    ) {

        mostrarInicio();

    }

    else {

        mostrarCategoria(
            categoriaAtual
        );

    }

}


/* =====================================================
   FAVORITOS
===================================================== */

function mostrarFavoritos() {

    const lista =
        videos.filter(
            video =>
                favoritos.includes(
                    video.video
                )
        );


    if (
        !lista.length
    ) {

        document
            .getElementById(
                "conteudo"
            )
            .innerHTML = `

                <div class="vazio">

                    <h2>
                        ♥ Favoritos
                    </h2>

                    <p>
                        Você ainda não adicionou
                        nenhum vídeo aos favoritos.
                    </p>

                </div>

            `;

        return;

    }


    document
        .getElementById(
            "conteudo"
        )
        .innerHTML = `

            <section class="secao">

                <div class="titulo-secao">

                    <h2>
                        ♥ Favoritos
                    </h2>

                    <span>
                        ${lista.length}
                        títulos
                    </span>

                </div>


                <div
                    class="linha-filmes"
                    style="
                        flex-wrap: wrap;
                        overflow-x: visible;
                    "
                >

                    ${
                        lista
                            .map(
                                criarCard
                            )
                            .join("")
                    }

                </div>

            </section>

        `;


    ativarEventos();

}


/* =====================================================
   CATEGORIA
===================================================== */

function mostrarCategoria(
    categoria
) {

    const lista =
        videos.filter(
            video =>
                video.categoria ===
                categoria
        );


    document
        .getElementById(
            "conteudo"
        )
        .innerHTML = `

            <section class="secao">

                <div class="titulo-secao">

                    <h2>

                        ${escaparHTML(
                            categoria
                        )}

                    </h2>


                    <span>

                        ${lista.length}
                        títulos

                    </span>

                </div>


                <div
                    class="linha-filmes"
                    style="
                        flex-wrap: wrap;
                        overflow-x: visible;
                    "
                >

                    ${
                        lista
                            .map(
                                criarCard
                            )
                            .join("")
                    }

                </div>

            </section>

        `;


    ativarEventos();

}


/* =====================================================
   PESQUISA
===================================================== */

document
    .getElementById(
        "pesquisa"
    )
    .addEventListener(
        "input",
        pesquisar
    );


function pesquisar() {

    const texto =
        document
            .getElementById(
                "pesquisa"
            )
            .value
            .toLowerCase()
            .trim();


    if (!texto) {

        if (
            categoriaAtual ===
            "Todos"
        ) {

            mostrarInicio();

        }

        else if (
            categoriaAtual ===
            "Favoritos"
        ) {

            mostrarFavoritos();

        }

        else {

            mostrarCategoria(
                categoriaAtual
            );

        }

        return;

    }


    const resultado =
        videos.filter(
            video => {


                const titulo =
                    String(
                        video.titulo || ""
                    )
                    .toLowerCase();


                const categoria =
                    String(
                        video.categoria || ""
                    )
                    .toLowerCase();


                return (
                    titulo.includes(
                        texto
                    ) ||
                    categoria.includes(
                        texto
                    )
                );

            }
        );


    document
        .getElementById(
            "conteudo"
        )
        .innerHTML = `

            <section class="secao">

                <div class="titulo-secao">

                    <h2>
                        Resultados
                    </h2>

                    <span>
                        ${resultado.length}
                        encontrados
                    </span>

                </div>


                ${
                    resultado.length

                    ?

                    `
                        <div
                            class="linha-filmes"
                            style="
                                flex-wrap: wrap;
                                overflow-x: visible;
                            "
                        >

                            ${
                                resultado
                                    .map(
                                        criarCard
                                    )
                                    .join("")
                            }

                        </div>
                    `

                    :

                    `
                        <div class="vazio">

                            Nenhum vídeo encontrado.

                        </div>
                    `
                }

            </section>

        `;


    ativarEventos();

}


/* =====================================================
   CARROSSEL
===================================================== */

function rolarCarrossel(
    botao,
    quantidade
) {

    const linha =
        botao
            .parentElement
            .querySelector(
                ".linha-filmes"
            );


    linha.scrollBy({

        left:
            quantidade,

        behavior:
            "smooth"

    });

}


/* =====================================================
   PROTEÇÃO HTML
===================================================== */

function escaparHTML(
    texto
) {

    return String(
        texto || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapar(
    texto
) {

    return escaparHTML(
        texto
    );

}
