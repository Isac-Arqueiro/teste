<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inicializador do Site</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #243b55,
                    #0b0f14 65%
                );

            color: #fff;
        }

        .container {
            width: 90%;
            max-width: 520px;

            padding: 40px;

            text-align: center;

            background: #161b22;

            border: 1px solid #30363d;

            border-radius: 20px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .55);
        }

        .logo {
            width: 82px;
            height: 82px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: #238636;

            font-size: 36px;
        }

        h1 {
            margin: 0 0 10px;

            font-size: 28px;
        }

        p {
            margin-bottom: 28px;

            color: #8b949e;

            line-height: 1.6;
        }

        #pasta {
            display: none;
        }

        button {
            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 10px;

            background: #238636;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: .2s;
        }

        button:hover {
            background: #2ea043;

            transform: translateY(-1px);
        }

        button:disabled {
            background: #30363d;

            color: #8b949e;

            cursor: wait;

            transform: none;
        }

        #status {
            min-height: 24px;

            margin-top: 20px;

            color: #58a6ff;

            font-size: 14px;
        }

        .info {
            margin-top: 25px;

            padding: 14px;

            border-radius: 10px;

            background: #21262d;

            color: #8b949e;

            font-size: 12px;

            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        ▶
    </div>

    <h1>Meu Site Offline</h1>

    <p>
        Selecione a pasta onde está o seu site.
    </p>

    <!--
        Permite selecionar uma pasta inteira.
    -->
    <input
        id="pasta"
        type="file"
        webkitdirectory
        directory
        multiple
    >

    <button id="abrir">
        ABRIR MEU SITE
    </button>

    <div id="status"></div>

    <div class="info">
        Selecione a pasta que contém o
        <strong>index.html</strong> e todos os
        arquivos do seu projeto.
    </div>

</div>


<script>

"use strict";


const inputPasta =
    document.getElementById("pasta");

const botao =
    document.getElementById("abrir");

const status =
    document.getElementById("status");


/*
 * Abre o seletor de pasta.
 */
botao.addEventListener("click", function () {

    inputPasta.value = "";

    status.textContent = "";

    inputPasta.click();

});


/*
 * Quando o usuário escolhe a pasta.
 */
inputPasta.addEventListener("change", async function () {

    const arquivos = Array.from(inputPasta.files);

    if (!arquivos.length) {

        status.textContent =
            "Nenhuma pasta foi selecionada.";

        return;
    }


    /*
     * Procura o index.html.
     */
    const index = arquivos.find(function (arquivo) {

        return arquivo.name.toLowerCase() === "index.html";

    });


    if (!index) {

        status.textContent =
            "Não encontrei index.html nessa pasta.";

        return;
    }


    botao.disabled = true;

    status.textContent =
        "Carregando seu site...";


    /*
     * Cria um mapa dos arquivos.
     */
    const mapa = new Map();


    for (const arquivo of arquivos) {

        /*
         * webkitRelativePath contém o caminho
         * relativo dentro da pasta escolhida.
         */

        mapa.set(
            arquivo.webkitRelativePath,
            arquivo
        );

    }


    /*
     * Lê o index.html.
     */
    const html =
        await index.text();


    /*
     * Cria uma página independente em memória.
     */
    const documento =
        new DOMParser().parseFromString(
            html,
            "text/html"
        );


    /*
     * Converte recursos locais:
     *
     * CSS
     * JavaScript
     * imagens
     * fontes
     *
     * para Blob URLs.
     */

    const recursos =
        documento.querySelectorAll(
            "img[src], script[src], link[href], source[src]"
        );


    for (const elemento of recursos) {

        let atributo;

        if (
            elemento.tagName === "SCRIPT" ||
            elemento.tagName === "IMG" ||
            elemento.tagName === "SOURCE"
        ) {

            atributo = "src";

        } else {

            atributo = "href";

        }


        const caminho =
            elemento.getAttribute(atributo);


        if (!caminho) {
            continue;
        }


        /*
         * Ignora URLs externas.
         */
        if (
            caminho.startsWith("http://") ||
            caminho.startsWith("https://") ||
            caminho.startsWith("data:") ||
            caminho.startsWith("blob:")
        ) {

            continue;
        }


        /*
         * Descobre o caminho relativo.
         */
        const caminhoLimpo =
            caminho.split("?")[0]
                  .split("#")[0]
                  .replace(/^\.\/+/, "");


        const arquivoEncontrado =
            arquivos.find(function (arquivo) {

                const relativo =
                    arquivo.webkitRelativePath;

                return relativo.endsWith(
                    "/" + caminhoLimpo
                );

            });


        if (!arquivoEncontrado) {
            continue;
        }


        const blobUrl =
            URL.createObjectURL(
                arquivoEncontrado
            );


        elemento.setAttribute(
            atributo,
            blobUrl
        );

    }


    /*
     * Substitui o inicializador pelo site.
     */
    document.open();

    document.write(
        "<!DOCTYPE html>" +
        documento.documentElement.outerHTML
    );

    document.close();

});


</script>

</body>
</html>
