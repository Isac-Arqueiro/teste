<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Site</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
        }

        .box {
            width: 90%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,.5);
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #8b949e;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            border: 0;
            border-radius: 10px;
            background: #238636;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2ea043;
        }

        #mensagem {
            margin-top: 20px;
            color: #58a6ff;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Meu Site</h1>

    <p>
        Clique abaixo para abrir o site offline.
    </p>

    <button id="abrir">
        ABRIR SITE
    </button>

    <div id="mensagem"></div>

</div>

<script>

const botao = document.getElementById("abrir");
const mensagem = document.getElementById("mensagem");

botao.addEventListener("click", function () {

    mensagem.textContent = "Abrindo site...";

    /*
     * O index.html deve estar na mesma pasta
     * deste inicializador.
     */

    window.location.href = "./index.html";

});

</script>

</body>
</html>
