<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Promo RN</title>

<style>
body { font-family: Arial; background:#111; color:#fff; text-align:center; }
input { padding:10px; width:70%; border-radius:10px; }
button { padding:10px; background:#00ff88; border:none; border-radius:10px; }
.card { background:#1e1e1e; margin:10px; padding:10px; border-radius:10px; }
</style>
</head>

<body>

<h2>🔥 Promoções Natal RN</h2>

<input id="busca" placeholder="Digite: manteiga, arroz...">
<button onclick="filtrar()">Buscar</button>

<div id="lista"></div>

<script>
let dados = [];

async function carregar() {
  let res = await fetch("dados.json");
  dados = await res.json();
  mostrar(dados);
}

function mostrar(lista){
  let html = "";
  lista.forEach(p => {
    html += `
      <div class="card">
        <b>${p.produto}</b><br>
        💰 ${p.preco}<br>
        🏬 ${p.loja}<br>
        <a href="${p.link}" target="_blank">Ver oferta</a>
      </div>
    `;
  });
  document.getElementById("lista").innerHTML = html;
}

function filtrar(){
  let termo = document.getElementById("busca").value.toLowerCase();
  let filtrado = dados.filter(p =>
    p.produto.toLowerCase().includes(termo)
  );
  mostrar(filtrado);
}

carregar();
</script>

</body>
</html>
